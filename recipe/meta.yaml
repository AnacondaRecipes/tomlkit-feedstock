{% set name = "tomlkit" %}
{% set version = "0.15.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7d1a9ecba3086638211b13814ea79c90dd54dd11993564376f3aa92271f5c7a3

build:
  number: 0
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vvv

requirements:
  host:
    - pip
    - poetry-core
    - python
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - tomlkit
    - tomlkit.api
    - tomlkit.container
    - tomlkit.exceptions
    - tomlkit.items
    - tomlkit.parser
    - tomlkit.source
    - tomlkit.toml_char
    - tomlkit.toml_document
    - tomlkit.toml_file
  requires:
    - pip
    - pytest
    - pyyaml
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -ra -v --tb=short tests

about:
  home: https://github.com/python-poetry/tomlkit
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - tests/toml-spec-tests/LICENSE
    - tests/toml-test/COPYING
  summary: Style preserving TOML library
  description: |
    This package is a 1.0.0-compliant TOML library.
  dev_url: https://github.com/python-poetry/tomlkit
  doc_url: https://github.com/python-poetry/tomlkit/blob/master/README.md

extra:
  recipe-maintainers:
    - ocefpaf
